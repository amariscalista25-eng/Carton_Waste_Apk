name: Build Flutter APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.5'
          channel: 'stable'

      - name: Create Clean Flutter Project Scaffold
        run: |
          # Create a temporary project to get correct android files
          flutter create temp_app --org com.scrap.tracker --project-name scrap_tracker
          # Move our custom lib and pubspec into it
          cp -r lib/* temp_app/lib/
          cp pubspec.yaml temp_app/pubspec.yaml
          cd temp_app
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app-release.apk
